      (d.kf?' km '+d.kf+(d.st?' conv.':''):'')+'</name><desc>'+(B.c||'')+'</desc></wpt>\n';
  });
  scarica(x+'</gpx>','selezione_SP.gpx','application/gpx+xml');
}
