// Il pallino segue te, la mappa no. Alla prima posizione trovata la vista si
// sposta una volta sola; dopo resta dove la lasci, cosi' puoi girare sulle
// strade selezionate senza essere riportato indietro. Per tornare sul pallino
// c'e' il pulsante apposito, che compare solo quando la posizione e' nota.
var mePos=null, meCer=null, inquadra=0;
function dove(){
  if(!navigator.geolocation){alert('Il telefono non fornisce la posizione.');return;}
  inquadra=1;
  map.locate({setView:false,enableHighAccuracy:true,watch:true,maximumAge:5000});
}
function torna(){
  if(mePos) map.setView(mePos.getLatLng(),Math.max(map.getZoom(),15));
  else dove();
}
map.on('locationfound',function(e){
  if(mePos) map.removeLayer(mePos);
  if(meCer) map.removeLayer(meCer);
  if(e.accuracy>25) meCer=L.circle(e.latlng,{radius:e.accuracy,color:'#1976d2',
    weight:1,opacity:.45,fillColor:'#1976d2',fillOpacity:.08,
    interactive:false}).addTo(map);
  mePos=L.circleMarker(e.latlng,{radius:8,color:'#fff',weight:3,
    fillColor:'#1976d2',fillOpacity:1}).bindTooltip('Sei qui',
    {permanent:true,direction:'top',className:'kmt'}).addTo(map);
  var b=document.getElementById('bTorna'); if(b) b.style.display='';
  if(inquadra){inquadra=0;map.setView(e.latlng,Math.max(map.getZoom(),15));}
});
map.on('locationerror',function(){
  alert('Posizione non disponibile.\n\nI browser la forniscono solo su pagine https.\n'+
        'Per il campo usa il GPX su OsmAnd o Organic Maps.');
});
// progressive convenzionali: dove la Provincia pubblica solo la lunghezza
// totale, l'intervallo 0+000 - lunghezza e' una comodita', non un dato.
function cls(d){return d.st?'kmt st':'kmt';}
function stima(d){return d.st?' <span class="st-txt">(convenzionale)</span>':'';}
// testo di avviso sui tratti passati ad ANAS: non sono piu' provinciali
function avviso(d){
  if(!d.an) return '';
  var t=d.an.tratte.map(function(x){return 'km '+x[0]+' &rarr; '+x[1]+' ('+x[2]+')';});
  return '<br><span class="av">'+(d.an.totale
      ? 'NON PIU\' PROVINCIALE. Passata interamente ad ANAS il '+ANAS_DATA+'.'
      : 'ATTENZIONE: '+d.an.km.toFixed(3)+' km passati ad ANAS il '+ANAS_DATA+
        ', non piu\' di competenza provinciale.')+
    '<br>'+t.join('<br>')+'</span>';
}
// annotazioni dell'elenco ufficiale (sovrapercorrenze, tratti ceduti ai Comuni,
// chilometriche invertite): vanno lette prima di mandare una squadra
function noteUff(d){
  if(!d.nu||!d.nu.length) return '';
  return '<br><span class="nu">Note dell\'elenco: '+d.nu.join(' &middot; ')+'</span>';
}
var gAll=L.layerGroup().addTo(map), gSel=L.layerGroup().addTo(map);
var tuttiB=null;
D.forEach(function(d,i){
  var pu='<b>'+d.s+'</b><br>'+(d.dn||'')+'<br>asse '+d.km+' km'+
   (d.kt&&d.kt-d.km>0.05?'<br><i>rami esclusi: '+(d.kt-d.km).toFixed(2)+' km</i>':'')+
   (d.kp>0?'<br><i>ricucito: '+(d.kp*1000).toFixed(0)+' m mancanti in OSM</i>':'')+
   (d.st?'<br><span class="st-txt">progressive convenzionali, non un dato '+
     'ufficiale: gli estremi sono 0+000 e la lunghezza ('+
     (d.sf||'origine non dichiarata')+'). Da verificare sui cippi.</span>':'')+
   avviso(d)+noteUff(d);
  var l=L.geoJSON(d.gi,{style:{color:'#9aa5b1',weight:2,opacity:.6}}).bindPopup(pu).addTo(gAll);
  if(d.gx) L.geoJSON(d.gx,{style:{color:'#c8cdd3',weight:1.5,opacity:.5,dashArray:'3,4'}}).addTo(gAll);
  if(d.gp) L.geoJSON(d.gp,{style:{color:'#9aa5b1',weight:2,opacity:.55,dashArray:'1,7',lineCap:'round'}}).addTo(gAll);
  var b=l.getBounds(); tuttiB = tuttiB ? tuttiB.extend(b) : b;
});
if(tuttiB) map.fitBounds(tuttiB.pad(.03));
function pan(v){document.getElementById('lat').classList[v?'add':'remove']('op');}
function riga(d,i){
  var c=d.a==='FUORI ELENCO'?'FUORI':d.a;
  return '<div class="r" id="r'+i+'"><input type="checkbox" id="c'+i+'" onchange="tog('+i+')">'+
   '<span class="b '+c+'"></span><span class="pz" id="p'+i+'" style="background:'+
   (sel[i]?colore(i):'transparent')+'"></span><span class="sg">'+d.s+'</span>'+
   '<span class="km">'+d.km+' km'+(d.kt&&d.kt-d.km>0.05?' <i>+'+(d.kt-d.km).toFixed(1)+'</i>':'')+
   '<br>'+(d.st?'<span class="st-txt">':'')+(d.ki||'')+(d.kf?' &rarr; '+d.kf:'')+
   (d.st?' ~</span>':'')+
   (d.kp>0?'<br><span style="color:#b26a00">cucito '+(d.kp*1000).toFixed(0)+' m</span>':'')+
   (d.an?'<br><span class="av">'+(d.an.totale?'ANAS, non provinciale':
        'ANAS: '+d.an.km.toFixed(1)+' km')+'</span>':'')+'</span></div>';
}
function disegna(){
  var q=document.getElementById('cerca').value.toUpperCase().replace(/\s+/g,' '),h='';
  D.forEach(function(d,i){if(d.s.indexOf(q)>=0)h+=riga(d,i);});
  document.getElementById('lista').innerHTML=h;
  D.forEach(function(d,i){var c=document.getElementById('c'+i);
   if(c){c.checked=!!sel[i];if(sel[i])document.getElementById('r'+i).classList.add('on');}});
}
function avvisoTesto(d){
  var r=[];
  if(d.an){
    r.push(d.an.totale?('passata interamente ad ANAS il '+ANAS_DATA)
                      :('ad ANAS il '+ANAS_DATA+': '+d.an.tratte.map(function(x){
                          return 'km '+x[0]+'-'+x[1];}).join(', ')));
  }
  if(d.nu&&d.nu.length) r.push(d.nu.join('; '));
  return r.length?r.join('<br>'):'';
}
function capo(d,basso){
  // basso=true -> estremo con progressiva minore
  if(d.v===1) return basso?{la:d.la,lo:d.lo,c:d.ci}:{la:d.lb,lo:d.lf,c:d.cf};
  if(d.v===2) return basso?{la:d.lb,lo:d.lf,c:d.cf}:{la:d.la,lo:d.lo,c:d.ci};
  return basso?{la:d.la,lo:d.lo,c:d.ci}:{la:d.lb,lo:d.lf,c:d.cf};
}
function tog(i){
  sel[i]=!sel[i];
  var r=document.getElementById('r'+i); var d=D[i];
  if(sel[i]){
    if(r)r.classList.add('on');
    L2[i]=L.layerGroup();
    var col=colore(i);
    if(d.gx) L.geoJSON(d.gx,{style:{color:col,weight:3,opacity:.55,dashArray:'5,6'}}).addTo(L2[i]);
    if(d.gp) L.geoJSON(d.gp,{style:{color:col,weight:5,opacity:.9,dashArray:'2,9',lineCap:'round'}})
      .bindPopup('<b>'+d.s+'</b><br>Tratto non presente in OpenStreetMap<br>'+
        'circa '+(d.kp*1000).toFixed(0)+' m, ricucito in linea retta<br>'+
        '<i>tipico attraversamento di centro abitato</i>').addTo(L2[i]);
    var gj=L.geoJSON(d.gi,{style:{color:col,weight:6,opacity:.95}});
    gj.bindTooltip('<span style="background:'+col+'">'+d.s+'</span>',
      {permanent:true,direction:'center',className:'lbl'});
    gj.addTo(L2[i]);
    var A=capo(d,true), B=capo(d,false);
    var nota=d.vr?('<br><i>verso: '+d.vr+'</i>'):'';
    if(A.la) L.circleMarker([A.la,A.lo],{radius:9,color:'#fff',weight:2,
      fillColor:'#2e7d32',fillOpacity:1})
      .bindTooltip(d.ki||'inizio',{permanent:true,direction:'top',className:cls(d)})
      .bindPopup('<b>'+d.s+' &mdash; INIZIO</b><br>'+
        (d.ki?'<b>km '+d.ki+'</b>'+stima(d)+'<br>':'')+(A.c||'')+'<br>'+A.la+', '+A.lo+nota).addTo(L2[i]);
    if(B.la) L.circleMarker([B.la,B.lo],{radius:9,color:'#fff',weight:2,
      fillColor:'#c0392b',fillOpacity:1})
      .bindTooltip(d.kf||'fine',{permanent:true,direction:'top',className:cls(d)})
      .bindPopup('<b>'+d.s+' &mdash; FINE</b><br>'+
        (d.kf?'<b>km '+d.kf+'</b>'+stima(d)+'<br>':'')+(B.c||'')+'<br>'+B.la+', '+B.lo+nota).addTo(L2[i]);
    L2[i].addTo(gSel);
    if(r){var p=document.getElementById('p'+i); if(p)p.style.background=col;}
  }else{
    if(r)r.classList.remove('on');
    var p=document.getElementById('p'+i); if(p)p.style.background='transparent';
    if(L2[i]){gSel.removeLayer(L2[i]);delete L2[i];}
    delete usati[i];
  }
  document.getElementById('cnt').textContent=Object.keys(sel).filter(function(k){return sel[k]}).length;
}
function tutte(v){D.forEach(function(d,i){if(!!sel[i]!==!!v){sel[i]=!v;tog(i);}});disegna();}
function zoom(){
  var b=[];Object.keys(sel).forEach(function(k){if(sel[k]&&L2[k])
   L2[k].eachLayer(function(l){if(l.getBounds)b.push(l.getBounds());});});
  if(b.length){var t=b[0];b.forEach(function(x){t=t.extend(x)});map.fitBounds(t.pad(.12));pan(0);}
}
function scarica(t,n,tp){var a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([t],{type:tp}));a.download=n;a.click();}
function scelte(){return D.filter(function(d,i){return sel[i]});}
function gpx(){
  var s=scelte();if(!s.length){alert('Nessuna strada selezionata.');return;}
  var x='<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="mappa_sp"'+
   ' xmlns="http://www.topografix.com/GPX/1/1">\n';
  s.forEach(function(d){
    var A=capo(d,true),B=capo(d,false);
    if(A.la)x+='<wpt lat="'+A.la+'" lon="'+A.lo+'"><name>'+d.s+' INIZIO'+
      (d.ki?' km '+d.ki+(d.st?' conv.':''):'')+'</name><desc>'+(A.c||'')+' - verso: '+(d.vr||'')+'</desc></wpt>\n';
    if(B.la)x+='<wpt lat="'+B.la+'" lon="'+B.lo+'"><name>'+d.s+' FINE'+
      (d.kf?' km '+d.kf+(d.st?' conv.':''):'')+'</name><desc>'+(B.c||'')+'</desc></wpt>\n';
  });
  scarica(x+'</gpx>','selezione_SP.gpx','application/gpx+xml');
}
function lista(){
  var s=scelte();if(!s.length){alert('Nessuna strada selezionata.');return;}
  var w=window.open('','_blank'),t=0;
  var h='<html><head><meta charset="utf-8"><title>Selezione SP</title><style>'+
   'body{font:12px system-ui;padding:20px}table{border-collapse:collapse;width:100%}'+
   'th,td{border:1px solid #ccc;padding:5px;text-align:left}th{background:#1F3864;color:#fff}'+
   'tr:nth-child(even){background:#f5f5f5}</style></head><body>'+
   '<h2>SP selezionate &mdash; Lodi</h2><table><tr><th>Sigla</th><th>Denominazione</th>'+
   '<th>km asse</th><th>Da (km basso)</th><th>A (km alto)</th><th>Coord. inizio</th>'+
   '<th>Coord. fine</th><th>Verso da</th><th>Affid.</th><th>Avvertenze</th></tr>';
  s.forEach(function(d){t+=d.km;var A=capo(d,true),B=capo(d,false);
   h+='<tr><td><b>'+d.s+'</b></td><td>'+(d.dn||'')+'</td><td>'+d.km+'</td>'+
    '<td>'+(d.ki||'')+(d.st?' (conv.)':'')+' '+(A.c||'')+'</td>'+
    '<td>'+(d.kf||'')+(d.st?' (conv.)':'')+' '+(B.c||'')+'</td>'+
    '<td>'+(A.la?A.la+', '+A.lo:'-')+'</td><td>'+(B.la?B.la+', '+B.lo:'-')+'</td>'+
    '<td>'+(d.vr||'')+'</td><td>'+d.a+'</td><td>'+avvisoTesto(d)+'</td></tr>';});
  h+='</table><p><b>'+s.length+' strade, '+t.toFixed(1)+' km.</b></p>'+
   '<p style="font-size:10px;color:#666">Geometrie &copy; OpenStreetMap contributors (ODbL). '+
   'Progressive e denominazioni: nessun elenco ufficiale disponibile per questa provincia.<br>'+
   '"km asse" e la lunghezza del percorso continuo da un capo all altro. La colonna "rami" '+
   'sono rotonde, bretelle e seconde carreggiate che OSM marca con la stessa sigla, escluse dal conteggio. '+
   '"cuciti" sono tratti assenti in OSM (di norma attraversamenti urbani) stimati in linea retta.<br>'+
   'La dicitura "(conv.)" segnala progressive convenzionali e non ufficiali: l intervallo va da '+
   '0+000 alla lunghezza, ed e messo solo per comodita di cantiere. La lunghezza puo venire '+
   'dall elenco della Provincia oppure, dove nemmeno quello esiste, dalla misura del tracciato '+
   'su OpenStreetMap: il popup della singola strada dice quale delle due. In entrambi i casi '+
   'vanno confermate sui cippi prima di delimitare un tratto di lavoro.<br>'+
   'La colonna "Verso da" dice come e stato stabilito quale capo ha la progressiva piu bassa: '+
   '"denominazione ufficiale" e affidabile, "presunto" e una deduzione geografica da verificare sul cippo. '+
   'Affidabilita MEDIA/BASSA: OSM traccia anche tratti non di competenza provinciale. '+
   'Affidabilita ANAS: la strada non e piu di competenza provinciale, il confronto dei km non ha senso.<br>'+
   'La colonna "Avvertenze" riporta i tratti passati ad ANAS e le annotazioni dell elenco ufficiale '+
   '(sovrapercorrenze, tratti ceduti ai Comuni, chilometriche invertite). Vanno lette prima di mandare una squadra.</p></body></html>';
  w.document.write(h);w.document.close();
}
document.getElementById('cerca').addEventListener('input',disegna);
disegna();
</script></body></html>
