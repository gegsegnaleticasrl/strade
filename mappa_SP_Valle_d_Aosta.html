      (d.ki?' km '+d.ki+(d.st?' conv.':''):'')+'</name><desc>'+(A.c||'')+' - verso: '+(d.vr||'')+'</desc></wpt>\n';
    if(B.la)x+='<wpt lat="'+B.la+'" lon="'+B.lo+'"><name>'+d.s+' FINE'+
      (d.kf?' km '+d.kf+(d.st?' conv.':''):'')+'</name><desc>'+(B.c||'')+'</desc></wpt>\n';
  });
  scarica(x+'</gpx>','selezione_SP.gpx','application/gpx+xml');
}
